name: auto_Reserve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          # 安装系统依赖：修复OpenCV(cv2)在Ubuntu无头环境下的导入错误
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev libgl1-mesa-glx libglib2.0-0 -y
          # 新增curl_cffi，保留原有依赖
          pip install cryptography requests opencv-python curl_cffi

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m debug --action
