name: auto_Reserve

# 完全保留你原来的触发方式
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          # 只补全缺失的依赖，其他完全和你原来的一样
          sudo apt-get install build-essential libssl-dev libffi-dev python3-dev libgl1-mesa-glx -y
          pip install cryptography requests opencv-python curl_cffi

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          # 完全保留你原来的运行命令，一点没改
          python main.py -m debug --action
